<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px} svg text.n{font-size:17px;font-weight:500} svg text.mid{text-anchor:middle} svg text.end{text-anchor:end}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">verify-gate · the Stop hook</div><div class="h">No receipt, <em>no stop</em>.</div>
<p class="cap">A model reads what really ran; every error or timeout lets the turn end, so a broken judge never traps you.</p>
<svg viewBox="0 0 1104 860" width="1104" height="860" style="margin-top:28px">
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1.5 L10 6 L2 10.5"/></marker><marker id="am" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="m" d="M2 1.5 L10 6 L2 10.5"/></marker></defs>
<rect class="f" x="300" y="0" width="340" height="56" rx="4"/>
<text class="s mid" x="470" y="35">the agent ends its turn</text>
<path d="M470 56 V86" marker-end="url(#ah)"/>
<path class="f" d="M470 88.0 L620.0 120 L470 152.0 L320.0 120 Z"/>
<text class="mid" x="470" y="126">llm_judge on?</text>
<path d="M620 120 H910"/>
<text class="t" x="636" y="110">no</text>
<text class="t" x="482" y="170">yes</text>
<path class="f" d="M470 188.0 L620.0 220 L470 252.0 L320.0 220 Z"/>
<text class="mid" x="470" y="226">under 2 blocks?</text>
<path d="M620 220 H910"/>
<text class="t" x="636" y="210">no</text>
<text class="t" x="482" y="270">yes</text>
<path class="f" d="M470 288.0 L620.0 320 L470 352.0 L320.0 320 Z"/>
<text class="mid" x="470" y="326">says UNVERIFIED?</text>
<path d="M620 320 H910"/>
<text class="t" x="636" y="310">yes</text>
<text class="t" x="482" y="370">no</text>
<path d="M470 152 V186" marker-end="url(#ah)"/>
<path d="M470 252 V286" marker-end="url(#ah)"/>
<path d="M470 352 V378" marker-end="url(#ah)"/>
<rect class="f" x="280" y="380" width="380" height="110" rx="4"/>
<text class="n" x="304" y="410">render the transcript</text>
<text class="t" x="304" y="436">tool calls + real output,</text>
<text class="t" x="304" y="458">newest 24,000 characters,</text>
<text class="t" x="304" y="480">ledger kinds as a backstop</text>
<path d="M470 490 V528" marker-end="url(#ah)"/>
<rect class="w" x="280" y="530" width="380" height="74" rx="4"/>
<text class="n" x="304" y="560">pipe to llm_judge_cmd</text>
<text class="t" x="304" y="586">claude -p --model haiku (isolated)</text>
<path d="M470 604 V636" marker-end="url(#ah)"/>
<path class="f" d="M470 638.0 L620.0 670 L470 702.0 L320.0 670 Z"/>
<text class="mid" x="470" y="676">starts with BLOCK?</text>
<path d="M620 670 H910"/>
<text class="t" x="636" y="660">PASS, error, or timeout</text>
<text class="t" x="482" y="720">yes</text>
<path class="m" d="M470 702 V748" marker-end="url(#am)"/>
<rect class="f m" x="280" y="750" width="380" height="74" rx="4"/>
<text class="n mt" x="304" y="780">block the stop</text>
<text class="t" x="304" y="806">{"decision": "block", ...}</text>
<path class="m d" d="M280 787 H210 V28 H298" marker-end="url(#am)"/>
<text class="si end" x="196" y="300">the agent gets</text>
<text class="si end" x="196" y="326">the reason back,</text>
<text class="si end" x="196" y="352">then does the work,</text>
<text class="si end" x="196" y="378">shows evidence, or</text>
<text class="si end" x="196" y="404">marks it UNVERIFIED</text>
<path d="M910 120 V748" marker-end="url(#ah)"/>
<rect class="f" x="780" y="750" width="260" height="74" rx="4"/>
<text class="s mid" x="910" y="786">the turn ends</text>
<text class="si mid" x="910" y="846">every other path passes</text>
</svg></div></body></html>
