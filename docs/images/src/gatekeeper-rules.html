<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css"><script src="dark.js"></script>
<style>.k{font-size:15px} svg text{font-size:16px} svg text.t{font-size:15px} svg text.n{font-size:17px;font-weight:500} svg text.mid{text-anchor:middle} svg text.end{text-anchor:end}</style></head>
<body><div id="fig" style="width:1200px">
<div class="k">gatekeeper · rule order</div><div class="h"><em>Deny</em> first, then tokens, then ask.</div>
<p class="cap">Only a person at a real terminal can mint the token that lets a require-token command through.</p>
<svg viewBox="0 0 1104 780" width="1104" height="780" style="margin-top:28px">
<defs><marker id="ah" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M2 1.5 L10 6 L2 10.5"/></marker><marker id="am" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path class="m" d="M2 1.5 L10 6 L2 10.5"/></marker></defs>
<text class="si" x="0" y="14">Loads rules/defaults.tsv, then your rules.local.tsv; a row with the same id wins.</text>
<rect class="f" x="180" y="40" width="240" height="46" rx="4"/>
<text class="mid" x="300" y="69">rules that match</text>
<path d="M300 86 V139" marker-end="url(#ah)"/>
<circle class="f" cx="300" cy="150" r="8"/>
<text class="n" x="0" y="146">1  deny</text>
<text class="t" x="0" y="170">rm-rf-outside-cwd</text>
<text class="t" x="0" y="192">git-push-force</text>
<path d="M300 159 V239" marker-end="url(#ah)"/>
<text class="t end" x="288" y="206.0">none</text>
<circle class="f" cx="300" cy="250" r="8"/>
<text class="n" x="0" y="246">2  require-token</text>
<text class="t" x="0" y="270">git-discard-dirty</text>
<path d="M300 259 V399" marker-end="url(#ah)"/>
<text class="t end" x="288" y="336.0">none</text>
<circle class="f" cx="300" cy="410" r="8"/>
<text class="n" x="0" y="406">3  ask</text>
<text class="t" x="0" y="430">git-commit-no-verify</text>
<text class="t" x="0" y="452">chmod-777</text>
<path d="M300 419 V509" marker-end="url(#ah)"/>
<text class="t end" x="288" y="471.0">none</text>
<circle class="f" cx="300" cy="520" r="8"/>
<text class="n" x="0" y="516">nothing matched</text>
<path d="M310 150 H766" marker-end="url(#ah)"/>
<rect class="f" x="770" y="127" width="334" height="46" rx="4"/>
<text x="790" y="156">denied, with the reason</text>
<path d="M310 250 H428" marker-end="url(#ah)"/>
<path class="f" d="M540 220.0 L650.0 250 L540 280.0 L430.0 250 Z"/>
<text class="mid" x="540" y="256">fresh token?</text>
<path d="M650 250 H766" marker-end="url(#ah)"/>
<text class="t" x="666" y="240">yes</text>
<rect class="f" x="770" y="227" width="334" height="46" rx="4"/>
<text x="790" y="256">runs; token is used up</text>
<path d="M540 280 V322 H766" marker-end="url(#ah)"/>
<text class="t" x="554" y="312">no</text>
<rect class="f" x="770" y="299" width="334" height="46" rx="4"/>
<text x="790" y="328">denied; prints pg-grant line</text>
<path d="M310 410 H766" marker-end="url(#ah)"/>
<rect class="f" x="770" y="387" width="334" height="46" rx="4"/>
<text x="790" y="416">Claude Code asks you</text>
<path d="M310 520 H766" marker-end="url(#ah)"/>
<rect class="f" x="770" y="497" width="334" height="46" rx="4"/>
<text x="790" y="526">runs; the hook stays silent</text>
<path class="faint" d="M0 590 H1104"/>
<text class="t" x="0" y="630">where a token comes from</text>
<text class="s" x="0" y="686">you, in a real terminal</text>
<path class="m" d="M232 680 H296" marker-end="url(#am)"/>
<rect class="f m" x="300" y="657" width="290" height="46" rx="4"/>
<text class="mt mid" x="445" y="686">pg-grant git-discard-dirty</text>
<path class="m" d="M598 680 H766" marker-end="url(#am)"/>
<rect class="w" x="770" y="657" width="334" height="46" rx="4"/>
<text x="790" y="686">token: 15 minutes, one use</text>
<text class="s" x="0" y="756">the agent's Bash tool</text>
<path d="M232 750 H296" marker-end="url(#ah)"/>
<rect class="f" x="300" y="727" width="290" height="46" rx="4"/>
<text class="mid" x="445" y="756">pg-grant git-discard-dirty</text>
<path d="M598 750 H766" marker-end="url(#ah)"/>
<text x="790" y="756">refused: stdin is not a TTY</text>
</svg></div></body></html>
