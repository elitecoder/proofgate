<body><div id="fig" style="width:1200px">
<div class="k">how it works · hooks/hooks.json</div><div class="h">Four moments in a turn, <em>one</em> verdict at the end.</div>
<p class="cap">Every hook is a shell entry point that calls standard-library Python and fails open.</p>
<svg viewBox="0 0 1104 504" width="1104" height="504" style="margin-top:28px">

<path d="M20 92 H126"/>
<path d="M152 92 H400" marker-end="url(#ah)"/>
<path d="M428 92 H676" marker-end="url(#ah)"/>
<path d="M704 92 H952" marker-end="url(#ah)"/>
<path d="M978 92 H1084"/>
<circle class="f" cx="138" cy="92" r="9"/>
<circle class="f" cx="414" cy="92" r="9"/>

<text class="t mid" x="552.0" y="24">repeats for every tool call</text>
<text class="s mid" x="138" y="134">you send a prompt</text>
<text class="t mid" x="138" y="158">UserPromptSubmit</text>
<rect class="f" x="20" y="184" width="236" height="136" rx="4"/>
<text class="n" x="36" y="214">turn-context</text>
<text class="t" x="36" y="238">adds a timestamp</text>
<text class="t" x="36" y="260">and a 4-line card;</text>
<text class="t" x="36" y="282">orders or pushback</text>
<text class="t" x="36" y="304">get one more card</text>
<text class="si" x="36" y="350">about 30 tokens</text>
<text class="si" x="36" y="372">on every prompt</text>
<text class="s mid" x="414" y="134">the agent calls a tool</text>
<text class="t mid" x="414" y="158">PreToolUse</text>
<rect class="f" x="296" y="184" width="236" height="92" rx="4"/>
<text class="n" x="312" y="214">gatekeeper</text>
<text class="t" x="312" y="238">denies, asks, or</text>
<text class="t" x="312" y="260">wants a token</text>
<rect class="f" x="296" y="292" width="236" height="92" rx="4"/>
<text class="n" x="312" y="322">notify-throttle</text>
<text class="t" x="312" y="346">one notification</text>
<text class="t" x="312" y="368">per 5 minutes</text>
<text class="s mid" x="690" y="134">the tool finishes</text>
<text class="t mid" x="690" y="158">PostToolUse</text>
<rect class="f" x="572" y="184" width="236" height="92" rx="4"/>
<text class="n" x="588" y="214">mark-dirty</text>
<text class="t" x="588" y="238">logs pushes, sends,</text>
<text class="t" x="588" y="260">commits, test runs</text>
<rect class="f" x="572" y="292" width="236" height="92" rx="4"/>
<text class="n" x="588" y="322">agent-file-lint</text>
<text class="t" x="588" y="346">bounces “why” prose</text>
<text class="t" x="588" y="368">in agent files</text>
<rect class="f" x="572" y="400" width="236" height="92" rx="4"/>
<text class="n" x="588" y="430">scope-budget</text>
<text class="t" x="588" y="454">pauses at 50 and</text>
<text class="t" x="588" y="476">150 dirty files</text>
<text class="s mid" x="966" y="134">the agent tries to stop</text>
<text class="t mt mid" x="966" y="158">Stop</text>
<rect class="f m" x="848" y="184" width="236" height="114" rx="4"/>
<text class="n" x="864" y="214">stop-gate</text>
<text class="t" x="864" y="238">a model reads the</text>
<text class="t" x="864" y="260">transcript, then</text>
<text class="t" x="864" y="282">blocks or passes</text>
<text class="si" x="864" y="328">at most 2 blocks a turn;</text>
<text class="si" x="864" y="350">UNVERIFIED skips it</text>
